{% if pending_payment %}
<div id="paymentPinModal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50"
    style="backdrop-filter: blur(8px);" data-expires="{{ pending_payment.expires_at|date:'c' }}"
    data-verify-url="{% url 'verify_payment_pin' %}">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden">
        <div class="bg-gradient-to-r from-green-600 to-emerald-600 p-6 text-white">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-trophy text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold">Congratulations!</h2>
                    <p class="text-green-100 text-sm">You won this lot!</p>
                </div>
            </div>
        </div>

        <form id="paymentPinForm" class="p-6">
            {% csrf_token %}
            <input type="hidden" name="lot_id" value="{{ lot.id }}">

            <div class="mb-6">
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                    <div class="flex">
                        <i class="fas fa-clock text-yellow-400 mt-1 mr-3"></i>
                        <div class="text-sm text-yellow-800">
                            <p class="font-bold mb-1">Payment Required</p>
                            <p>Enter your transaction PIN to complete payment within <span id="payment-timer"
                                    class="font-bold">15:00</span></p>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 rounded-lg p-4 mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-slate-600">Lot:</span>
                        <span class="text-sm font-bold text-slate-900">{{ lot.title }}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">Amount:</span>
                        <span class="text-2xl font-black text-green-600">₹{{
                            pending_payment.amount|floatformat:2}}</span>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-700 mb-2">
                        <i class="fas fa-lock text-green-600 mr-2"></i>Enter Transaction PIN
                    </label>
                    <input type="password" name="pin" id="payment-pin" maxlength="6"
                        class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-green-500 focus:outline-none text-center text-2xl tracking-widest font-bold"
                        placeholder="••••" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                </div>

                <div id="paymentPinError"
                    class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
                <div id="paymentPinSuccess"
                    class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
                </div>
            </div>

            <button type="submit" id="verifyPaymentBtn"
                class="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold uppercase tracking-wider rounded-lg transition-all transform hover:scale-105 shadow-lg">
                <i class="fas fa-check-circle mr-2"></i>Confirm Payment
            </button>

            <p class="text-xs text-slate-500 text-center mt-4">
                <i class="fas fa-info-circle mr-1"></i>Your payment will be processed securely
            </p>
        </form>
    </div>
</div>

<script>
    (function () {
        // Encapsulate to avoid global pollutant if loaded multiple times
        // BUT we need it to run when injected.

        // Payment Timer Countdown
        const expiresAtStr = "{{ pending_payment.expires_at|date:'c' }}";
        if (!expiresAtStr) return;

        const expiresAt = new Date(expiresAtStr);
        const timerDisplay = document.getElementById('payment-timer');

        function updatePaymentTimer() {
            if (!timerDisplay) return;
            const now = new Date();
            const distance = expiresAt - now;

            if (distance < 0) {
                timerDisplay.textContent = "EXPIRED";
                timerDisplay.classList.add('text-red-600');
                const btn = document.getElementById('verifyPaymentBtn');
                if (btn) btn.disabled = true;
                const err = document.getElementById('paymentPinError');
                if (err) {
                    err.textContent = 'Payment window has expired. The lot will be offered to the next bidder.';
                    err.classList.remove('hidden');
                }
                return;
            }

            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Warning when less than 2 minutes
            if (distance < 120000) {
                timerDisplay.classList.add('text-red-600', 'font-bold');
            }
        }

        updatePaymentTimer();
        const paymentTimerInterval = setInterval(updatePaymentTimer, 1000);
        // Store interval to clear it later? Attach to window or element?
        // simple way: 
        window.currentPaymentInterval = paymentTimerInterval;


        // Payment PIN Form Handler
        const form = document.getElementById('paymentPinForm');
        if (form) {
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const pin = document.getElementById('payment-pin').value;
                const errorDiv = document.getElementById('paymentPinError');
                const successDiv = document.getElementById('paymentPinSuccess');
                const submitBtn = document.getElementById('verifyPaymentBtn');

                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');

                if (!/^\d{4,6}$/.test(pin)) {
                    errorDiv.textContent = 'PIN must be 4-6 digits';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';

                try {
                    const formData = new FormData(this);
                    const response = await fetch('{% url "verify_payment_pin" %}', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.success) {
                        successDiv.textContent = data.message;
                        successDiv.classList.remove('hidden');

                        // Hide modal immediately
                        const paymentModal = document.getElementById('paymentPinModal');
                        if (paymentModal) {
                            paymentModal.classList.add('hidden');
                            paymentModal.remove(); // Remove from DOM entirely on success
                        }

                        // STOP THE TIMER
                        if (window.currentPaymentInterval) {
                            clearInterval(window.currentPaymentInterval);
                        }

                        // Main page timer update (if exists outside)
                        const mainTimerDisplay = document.getElementById('timer-display');
                        if (mainTimerDisplay) {
                            mainTimerDisplay.textContent = "PAID";
                            mainTimerDisplay.classList.remove('text-red-600');
                            mainTimerDisplay.classList.add('text-green-600');
                        }

                        // Show Winner Overlay Logic (global scope function)
                        if (window.showWinnerOverlay) {
                            window.showWinnerOverlay("{{ request.user.username }}", "₹{{ pending_payment.amount|floatformat:2 }}");
                        } else {
                            // Fallback reload
                            window.location.reload();
                        }

                    } else {
                        errorDiv.textContent = data.error || 'Payment verification failed';
                        errorDiv.classList.remove('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Confirm Payment';
                    }
                } catch (error) {
                    errorDiv.textContent = 'An error occurred. Please try again.';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Confirm Payment';
                }
            });
        }

        const pinInput = document.getElementById('payment-pin');
        if (pinInput) {
            pinInput.addEventListener('input', function (e) {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        }
    })();
</script>
{% endif %}
