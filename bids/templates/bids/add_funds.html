{% extends 'base.html' %}
{% load static %}

{% block title %}Add Funds - Auction House{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 py-8">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="mb-8">
            <a href="{% url 'wallet_dashboard' %}"
                class="text-purple-600 hover:text-purple-700 font-semibold mb-4 inline-block">
                <i class="fas fa-arrow-left mr-2"></i>Back to Wallet
            </a>
            <h1 class="text-3xl md:text-4xl font-black text-slate-900">
                <i class="fas fa-plus-circle text-green-600 mr-3"></i>Add Funds
            </h1>
            <p class="text-slate-600 mt-2">Add money to your wallet for bidding</p>
        </div>

        <!-- Add Funds Form -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form id="addFundsForm" onsubmit="initiateRazorpayAddFunds(event)">
                {% csrf_token %}

                <div class="mb-6">
                    <label for="amount" class="block text-sm font-bold text-slate-700 mb-2">
                        Amount (₹)
                    </label>
                    <input type="number" id="addAmount" name="amount" step="1" min="100" required
                        class="w-full px-4 py-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-green-600 text-lg font-semibold"
                        placeholder="Enter amount">
                    <p class="text-slate-500 text-xs mt-2">Minimum amount: ₹100.00</p>
                </div>

                <!-- Quick Amount Buttons -->
                <div class="mb-6">
                    <p class="text-sm font-bold text-slate-700 mb-3">Quick Select:</p>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" onclick="document.getElementById('addAmount').value = '1000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹1,000
                        </button>
                        <button type="button" onclick="document.getElementById('addAmount').value = '5000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹5,000
                        </button>
                        <button type="button" onclick="document.getElementById('addAmount').value = '10000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹10,000
                        </button>
                        <button type="button" onclick="document.getElementById('addAmount').value = '25000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹25,000
                        </button>
                        <button type="button" onclick="document.getElementById('addAmount').value = '50000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹50,000
                        </button>
                        <button type="button" onclick="document.getElementById('addAmount').value = '100000'"
                            class="bg-slate-100 hover:bg-green-100 text-slate-700 hover:text-green-700 font-bold py-3 rounded-lg transition border-2 border-transparent hover:border-green-600">
                            ₹1,00,000
                        </button>
                    </div>
                </div>

                <!-- Info Box -->
                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-shield-alt text-blue-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-blue-700 font-bold uppercase tracking-wide">
                                SECURED VIA RAZORPAY ENCRYPTION
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="addFundsPayBtn"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-4 rounded-lg transition shadow-lg">
                    <i class="fas fa-check-circle mr-2"></i>Pay via Razorpay
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    async function initiateRazorpayAddFunds(e) {
        e.preventDefault();
        const amountInput = document.getElementById('addAmount');
        if (!amountInput) return;
        const amount = amountInput.value;

        if (!amount || amount < 100) {
            alert("Please enter a valid amount (Min: 100)");
            return;
        }

        const btn = document.getElementById('addFundsPayBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';

        try {
            const response = await fetch("{% url 'create_wallet_add_funds_order' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({ amount: amount })
            });

            const data = await response.json();

            if (data.success) {
                const options = {
                    "key": data.key,
                    "amount": data.amount,
                    "currency": data.currency,
                    "name": "Auction House",
                    "description": "Add Funds to Wallet",
                    "order_id": data.razorpay_order_id,
                    "handler": async function (response) {
                        const verifyResp = await fetch("{% url 'verify_wallet_add_funds' %}", {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                            },
                            body: JSON.stringify({
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_signature: response.razorpay_signature,
                                amount: data.amount
                            })
                        });
                        const verifyData = await verifyResp.json();
                        if (verifyData.success) {
                            window.location.href = "{% url 'profile' %}";
                        } else {
                            alert("Verification Failed: " + verifyData.error);
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Pay via Razorpay';
                        }
                    },
                    "prefill": {
                        "name": data.user_name,
                        "email": data.user_email
                    },
                    "theme": {
                        "color": "#10b981"
                    },
                    "modal": {
                        "ondismiss": function () {
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Pay via Razorpay';
                        }
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            } else {
                alert('Error: ' + data.error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Pay via Razorpay';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to initiate payment. Please try again.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Pay via Razorpay';
        }
    }
</script>
{% endblock %}
